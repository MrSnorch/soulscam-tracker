name: Fix first scan (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/armoury/fix_first_scan.py
      - name: Commit and push
        run: |
          git config user.name "one-off-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/armoury/players.json docs/armoury/history/
          git diff --cached --quiet || git commit -m "chore: fix first-scan false is_active_today"
          git push
