name: Soulscam Tracker Poll

on:
  workflow_dispatch:   # triggered manually, or by this workflow re-triggering itself
  schedule:
    - cron: '*/30 * * * *'   # safety net in case the self-retrigger chain ever breaks

concurrency:
  group: poll-steam-players
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # stay under GitHub's 360-minute (6h) job limit
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Without an explicit ref, checkout can leave the runner in a
          # detached HEAD state on repeated programmatic workflow_dispatch
          # triggers (see the "Re-trigger this workflow" step below) - the
          # symptom is "You are not currently on a branch" on every git pull
          # / push for the rest of the job, silently swallowed by the
          # `|| true` guards further down, so commits kept piling up locally
          # and never actually got pushed.
          ref: ${{ github.ref_name }}

      - name: Confirm we're on a branch, not detached HEAD
        run: |
          git symbolic-ref -q HEAD || {
            echo "::error::Checkout left us in detached HEAD - aborting before we silently lose commits."
            exit 1
          }
          echo "On branch: $(git symbolic-ref --short HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Poll Steam API for ~5.5 hours, committing each hourly flush
        run: |
          python3 -u scripts/poll.py &
          POLL_PID=$!

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="$(git symbolic-ref --short HEAD)"

          # Commit new data every 5 minutes while poll.py runs in the background,
          # so docs/ changes -> Pages redeploys roughly once every 5 minutes
          # instead of once a minute (frequent pushes were queueing up Pages
          # deployments and causing them to sit "in progress" for minutes at
          # a time). build-index.py caches parsed hourly data in
          # docs/.recent-cache.json and only re-reads "live" hours/days, so
          # it stays cheap even run every few minutes as history grows.
          while kill -0 $POLL_PID 2>/dev/null; do
            sleep 300
            python3 scripts/build-index.py
            git add docs/hourly/ docs/points-by-day/ docs/recent.json docs/points.json docs/points-index.json docs/.recent-cache.json
            git diff --cached --quiet || git commit -m "chore: player count $(date -u +'%Y-%m-%dT%H:%M')"
            git pull --rebase --quiet origin "$BRANCH" || true
            git push --quiet origin "HEAD:$BRANCH" || true
          done

          wait $POLL_PID

          # Rebuild the dashboard's aggregate and commit anything flushed at the end.
          python3 scripts/build-index.py
          git add docs/hourly/ docs/points-by-day/ docs/recent.json docs/points.json docs/points-index.json docs/.recent-cache.json
          git diff --cached --quiet || git commit -m "chore: player count $(date -u +'%Y-%m-%dT%H:%M') (final)"
          git pull --rebase --quiet origin "$BRANCH" || true
          git push --quiet origin "HEAD:$BRANCH" || true

      - name: Re-trigger this workflow to keep polling
        if: always()
        run: |
          curl -f -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/poll.yml/dispatches \
            -d '{"ref":"${{ github.ref_name }}"}'
