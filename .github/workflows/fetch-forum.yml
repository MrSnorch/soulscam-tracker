name: Fetch Steam forum activity

# This is deliberately a SEPARATE workflow from fetch-reviews.yml, not a
# step added onto it: forum scraping works over HTML (not Steam's official
# Web API) and is materially less reliable - Steam's markup can change
# without notice, and datacenter IPs (including GitHub Actions runners)
# are more likely to get rate-limited/blocked than a residential IP. If
# this workflow starts failing outright, it should not take the much more
# stable review-fetch pipeline down with it.
#
# On a failed or zero-result scrape, existing docs/reviews/forum-*.json
# data is left as-is (not wiped) - see scrape_forum.py's load_existing().

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      appid:
        description: 'Steam appid to scrape (overrides repo variable STEAM_APPID)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fetch-forum
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # ~30min headroom over the scraper's own 5h (300min) internal cap,
                            # to leave room for the enrich step + commit/push, while staying
                            # under GitHub's 360-minute (6h) hard job limit
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve appid
        id: cfg
        run: |
          APPID="${{ github.event.inputs.appid }}"
          if [ -z "$APPID" ]; then
            APPID="${{ vars.STEAM_APPID }}"
          fi
          if [ -z "$APPID" ]; then
            echo "No appid provided. Set repo variable STEAM_APPID or pass one via workflow_dispatch." >&2
            exit 1
          fi
          echo "appid=$APPID" >> "$GITHUB_OUTPUT"

      - name: Scrape forum for steamids
        run: |
          python scripts/reviews/scrape_forum.py \
            --appid "${{ steps.cfg.outputs.appid }}" \
            --out docs/reviews/forum-profiles.json \
            --sleep 1.0

      - name: Cross-check accounts against Steam API + review data
        if: always()
        env:
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
        run: |
          if [ -z "$STEAM_WEB_API_KEY" ]; then
            echo "No STEAM_WEB_API_KEY secret set - skipping the account cross-check step (forum-profiles.json is still collected)."
            exit 0
          fi
          if [ ! -f docs/reviews/forum-profiles.json ]; then
            echo "docs/reviews/forum-profiles.json missing, skipping cross-check"
            exit 0
          fi
          python scripts/reviews/enrich_forum_profiles.py \
            --appid "${{ steps.cfg.outputs.appid }}" \
            --forum-profiles docs/reviews/forum-profiles.json \
            --reviews docs/reviews/latest.json \
            --out docs/reviews/forum-activity.json \
            --api-key "$STEAM_WEB_API_KEY" \
            --sleep 0.6 \
            --max-accounts 300 \
            --check-friends \
            --max-friends-per-account 50 \
            --max-friend-accounts 500

      - name: Commit and push updated data
        if: always()
        run: |
          if git check-ignore -q docs/reviews; then
            echo "::error::docs/reviews is being ignored by .gitignore! Fix .gitignore and rerun."
            exit 1
          fi
          git config user.name "forum-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f docs/reviews/forum-profiles.json docs/reviews/forum-activity.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore: update forum activity data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

          for attempt in 1 2 3 4 5; do
            if git push --quiet; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5), rebasing onto latest and retrying..."
            git pull --rebase --quiet
            sleep 2
          done
          echo "::error::Failed to push forum data after 5 attempts."
          exit 1
