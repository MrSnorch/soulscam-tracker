name: Fetch Steam review comments

# Deliberately a SEPARATE workflow from fetch-reviews.yml (same reasoning
# as fetch-forum.yml): this scrapes an undocumented HTML/JSON endpoint,
# not the official appreviews API, so it's slower and more likely to
# break or get rate-limited than the main review pipeline. Splitting it
# out means:
#   - it doesn't force a full review re-fetch just to refresh comments
#   - a comment-scrape failure never blocks/delays the main reviews data
#   - it can run on its own, less-frequent schedule
#
# This reads the *existing* docs/reviews/latest.json already committed by
# fetch-reviews.yml - it does not re-fetch reviews itself. If that file
# doesn't exist yet (first-ever run), it skips cleanly.

on:
  schedule:
    # once every 6 hours, offset from fetch-reviews.yml's :00 slots so the
    # two don't both hit Steam at the exact same moment
    - cron: '20 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-comments
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch real comment text under reviews
        run: |
          mkdir -p tmp
          if [ ! -f docs/reviews/latest.json ]; then
            echo "docs/reviews/latest.json missing (fetch-reviews.yml hasn't run yet), skipping"
            exit 0
          fi
          python scripts/reviews/fetch_review_comments.py \
            --reviews-in docs/reviews/latest.json \
            --out docs/reviews/comments.json \
            --recent-out docs/reviews/recent-comments.json \
            --sleep 1.0 \
            --debug-dump-first tmp/comments_debug_first.json \
            --report-out tmp/report_comments.json

      - name: Upload comment-fetch debug dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comments-debug-dump
          path: tmp/comments_debug_first.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit and push updated comment data
        if: always()
        run: |
          if [ ! -f docs/reviews/comments.json ] && [ ! -f docs/reviews/recent-comments.json ]; then
            echo "No comment data files produced, nothing to commit."
            exit 0
          fi
          if git check-ignore -q docs/reviews; then
            echo "::error::docs/reviews is being ignored by .gitignore! Fix .gitignore and rerun."
            exit 1
          fi
          git config user.name "review-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f docs/reviews/comments.json docs/reviews/recent-comments.json

          if git diff --cached --quiet; then
            echo "No comment data changes to commit."
            exit 0
          fi

          git commit -m "chore: update review comments ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

          # Same retry-with-rebase dance as fetch-reviews.yml, since both
          # workflows (plus poll.yml) can push to the same branch.
          for attempt in 1 2 3 4 5; do
            if git push --quiet; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5), rebasing onto latest and retrying..."
            git pull --rebase --quiet
            sleep 2
          done
          echo "::error::Failed to push comment data after 5 attempts."
          exit 1

      - name: Write job summary
        if: always()
        run: |
          python scripts/reviews/write_comments_summary.py \
            --report tmp/report_comments.json \
            >> "$GITHUB_STEP_SUMMARY"
