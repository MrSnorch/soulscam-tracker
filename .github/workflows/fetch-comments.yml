name: Fetch Steam review comments

# Tracks NEW COMMENT EVENTS under reviews (comment_count going up between
# runs), not comment text. Steam's comment-render endpoint requires an
# authenticated session - see fetch_review_comments.py's module docstring
# for the full story of why scraping it anonymously never worked, no
# matter the IP/proxy/Tor/browser combination. This reads the *existing*
# docs/reviews/latest.json already committed by fetch-reviews.yml - it
# does not re-fetch reviews itself, and needs no network access at all.

on:
  schedule:
    # once every 6 hours, offset from fetch-reviews.yml's :00 slots so the
    # two don't both hit Steam at the exact same moment
    - cron: '20 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-comments
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect new comments under reviews
        run: |
          mkdir -p tmp
          if [ ! -f docs/reviews/latest.json ]; then
            echo "docs/reviews/latest.json missing (fetch-reviews.yml hasn't run yet), skipping"
            exit 0
          fi
          python scripts/reviews/fetch_review_comments.py \
            --reviews-in docs/reviews/latest.json \
            --out docs/reviews/comments.json \
            --recent-out docs/reviews/recent-comments.json \
            --report-out tmp/report_comments.json

      - name: Commit and push updated comment data
        if: always()
        run: |
          if [ ! -f docs/reviews/comments.json ] && [ ! -f docs/reviews/recent-comments.json ]; then
            echo "No comment data files produced, nothing to commit."
            exit 0
          fi
          if git check-ignore -q docs/reviews; then
            echo "::error::docs/reviews is being ignored by .gitignore! Fix .gitignore and rerun."
            exit 1
          fi
          git config user.name "review-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f docs/reviews/comments.json docs/reviews/recent-comments.json

          if git diff --cached --quiet; then
            echo "No comment data changes to commit."
            exit 0
          fi

          git commit -m "chore: update review comment activity ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

          # Same retry-with-rebase dance as fetch-reviews.yml, since both
          # workflows (plus poll.yml) can push to the same branch.
          for attempt in 1 2 3 4 5; do
            if git push --quiet; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5), rebasing onto latest and retrying..."
            git pull --rebase --quiet
            sleep 2
          done
          echo "::error::Failed to push comment data after 5 attempts."
          exit 1

      - name: Write job summary
        if: always()
        run: |
          python scripts/reviews/write_comments_summary.py \
            --report tmp/report_comments.json \
            >> "$GITHUB_STEP_SUMMARY"
