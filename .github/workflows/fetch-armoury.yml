name: Fetch Armoury data

# Scrapes https://soulbound.game/armoury/ for every player (all regions)
# and writes docs/armoury/*.json - the accumulating known-players
# database, "real online today" stat, the by-server/trend/retention
# charts, per-player change history (docs/armoury/history/<slug>.json),
# and the name-duplicates tab. Separate workflow from poll.yml (Steam API
# player counts) and fetch-forum.yml (Steam forum scraping) - a failed or
# slow armoury scrape shouldn't affect either of those.
#
# Sharded across N parallel runners (N computed from the actual player list
# size, ~15 shards at current ~6000 players / 400 per shard) to keep each run
# fast:
#   1. find_last_page - quick reconnaissance: finds the last non-empty page
#                     number of the armoury list (via exponential growth +
#                     binary search - see find_last_list_page() in
#                     soulbound_armoury_scraper.py) without downloading and
#                     parsing every page along the way. Needed before the
#                     list itself can be sharded, since the total number of
#                     pages isn't known upfront.
#   2. scan_list    - matrix of M runners, each parses its own range of list
#                     pages ([1, last_page] split evenly - see
#                     scan_list_shard.py) and uploads its own
#                     list_shard_<i>.json. Splitting the list-collection
#                     itself (not just the per-player scraping) across
#                     runners is what keeps this fast as the player base
#                     keeps growing - a single sequential runner previously
#                     hit its own job timeout partway through the list once
#                     it grew past ~250 pages.
#   3. merge_list   - downloads all list_shard_*.json, merges+dedupes them
#                     into players_list.json (same format list_players.py
#                     used to produce directly, so scrape_shard.py below is
#                     unchanged), uploads it as an artifact, and computes how
#                     many 400-player shards are needed to cover the WHOLE
#                     list (previously hardcoded to 5 shards / 2000 players,
#                     which silently stopped covering the rest of the list
#                     once the player base grew past that - see the
#                     shard-count computation below).
#   4. scrape       - matrix of N runners (N from merge_list), each
#                     downloads the list and scrapes its own 400-player
#                     slice, uploads its own shard result.
#   5. merge        - downloads all shard results (however many there were),
#                     merges them into the accumulating known-players
#                     database in docs/armoury/*.json (existing players are
#                     updated, never dropped - see merge_shards.py), commits
#                     and pushes.
#   6. trigger-next - on success, sleeps until an hour has passed since
#                     this run started, then kicks off the next run via
#                     workflow_dispatch (using GH_PAT, since the default
#                     GITHUB_TOKEN is deliberately blocked from triggering
#                     further workflow runs). This guarantees exactly one
#                     hour between run starts, rather than "however long
#                     the scrape took" - the tradeoff is the runner just
#                     sits idle for the leftover minutes, burning Actions
#                     minutes for nothing. The hourly cron below is a
#                     fallback in case a run fails before reaching this
#                     job.
#
# Each shard runner (both scan_list and scrape) gets the same safe fixed
# starting delay (see scan_list_shard.py / scrape_shard.py) rather than
# sharing/adapting one rate limiter across processes - parallel runners
# land on different GitHub Actions IPs, so there's nothing meaningful to
# coordinate between them.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-armoury
  cancel-in-progress: false

env:
  SHARD_SIZE: 400
  LIST_PAGES_PER_SHARD: 20

jobs:
  find_last_page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Record run start time
        run: date +%s > run_started_at.txt

      - name: Upload run start time
        uses: actions/upload-artifact@v4
        with:
          name: armoury-run-started-at
          path: run_started_at.txt
          retention-days: 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 --break-system-packages

      - name: Find last list page
        run: python scripts/armoury/find_last_page.py -o last_page.txt

      - name: Compute list-scan matrix from page count
        id: pages
        run: |
          LAST_PAGE=$(cat last_page.txt)
          PAGES_PER_SHARD=${{ env.LIST_PAGES_PER_SHARD }}
          NUM_LIST_SHARDS=$(( (LAST_PAGE + PAGES_PER_SHARD - 1) / PAGES_PER_SHARD ))
          echo "List has $LAST_PAGE pages -> $NUM_LIST_SHARDS list-scan shards of $PAGES_PER_SHARD pages"
          MATRIX=$(python3 -c "import json; print(json.dumps(list(range($NUM_LIST_SHARDS))))")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "last_page=$LAST_PAGE" >> "$GITHUB_OUTPUT"
    outputs:
      list_matrix: ${{ steps.pages.outputs.matrix }}
      last_page: ${{ steps.pages.outputs.last_page }}

  scan_list:
    needs: find_last_page
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    strategy:
      fail-fast: false
      matrix:
        list_shard: ${{ fromJson(needs.find_last_page.outputs.list_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 --break-system-packages

      - name: Scan this page range
        run: |
          PAGES_PER_SHARD=${{ env.LIST_PAGES_PER_SHARD }}
          LAST_PAGE=${{ needs.find_last_page.outputs.last_page }}
          START=$(( ${{ matrix.list_shard }} * PAGES_PER_SHARD + 1 ))
          END=$(( START + PAGES_PER_SHARD - 1 ))
          if [ "$END" -gt "$LAST_PAGE" ]; then
            END=$LAST_PAGE
          fi
          python scripts/armoury/scan_list_shard.py \
            --start-page "$START" --end-page "$END" \
            -o "list_shard_${{ matrix.list_shard }}.json"

      - name: Upload list shard result
        uses: actions/upload-artifact@v4
        with:
          name: armoury-list-shard-${{ matrix.list_shard }}
          path: list_shard_${{ matrix.list_shard }}.json
          retention-days: 1

  merge_list:
    needs: scan_list
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all list shard results
        uses: actions/download-artifact@v4
        with:
          pattern: armoury-list-shard-*
          merge-multiple: true

      - name: Merge list shards into players_list.json
        run: |
          LIST_SHARD_FILES=$(ls list_shard_*.json 2>/dev/null | sort -V)
          if [ -z "$LIST_SHARD_FILES" ]; then
            echo "::error::No list_shard_*.json files found to merge."
            exit 1
          fi
          echo "Merging: $LIST_SHARD_FILES"
          python scripts/armoury/merge_list_shards.py $LIST_SHARD_FILES -o players_list.json

      - name: Compute shard count from actual player list size
        id: shards
        run: |
          COUNT=$(python3 -c "import json; print(len(json.load(open('players_list.json'))))")
          SHARD_SIZE=${{ env.SHARD_SIZE }}
          # ceil division, so a partially-filled last shard still gets its own runner
          NUM_SHARDS=$(( (COUNT + SHARD_SIZE - 1) / SHARD_SIZE ))
          echo "Player list has $COUNT entries -> $NUM_SHARDS shards of $SHARD_SIZE"
          # matrix.shard needs a JSON array [0, 1, ..., NUM_SHARDS-1]
          MATRIX=$(python3 -c "import json; print(json.dumps(list(range($NUM_SHARDS))))")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "num_shards=$NUM_SHARDS" >> "$GITHUB_OUTPUT"

      - name: Upload player list
        uses: actions/upload-artifact@v4
        with:
          name: armoury-players-list
          path: players_list.json
          retention-days: 1
    outputs:
      shard_matrix: ${{ steps.shards.outputs.matrix }}
      num_shards: ${{ steps.shards.outputs.num_shards }}

  scrape:
    needs: merge_list
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.merge_list.outputs.shard_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 --break-system-packages

      - name: Download player list
        uses: actions/download-artifact@v4
        with:
          name: armoury-players-list

      - name: Scrape this shard
        run: |
          START=$(( ${{ matrix.shard }} * ${{ env.SHARD_SIZE }} ))
          END=$(( START + ${{ env.SHARD_SIZE }} ))
          python scripts/armoury/scrape_shard.py players_list.json \
            --start "$START" --end "$END" \
            -o "shard_${{ matrix.shard }}.json"

      - name: Upload shard result
        uses: actions/upload-artifact@v4
        with:
          name: armoury-shard-${{ matrix.shard }}
          path: shard_${{ matrix.shard }}.json
          retention-days: 1

  merge:
    needs: [merge_list, scrape]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: armoury-shard-*
          merge-multiple: true

      - name: Merge shards into dashboard data
        run: |
          # Collect whichever shard_*.json files actually got downloaded,
          # instead of hardcoding shard_0..shard_4 - the shard count is now
          # dynamic (see the "list" job), so a fixed list here would silently
          # ignore shards beyond whatever number used to be hardcoded.
          SHARD_FILES=$(ls shard_*.json 2>/dev/null | sort -V)
          if [ -z "$SHARD_FILES" ]; then
            echo "::error::No shard_*.json files found to merge."
            exit 1
          fi
          echo "Merging: $SHARD_FILES"
          python scripts/armoury/merge_shards.py $SHARD_FILES

      - name: Commit and push updated data
        if: always()
        run: |
          git config user.name "armoury-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f docs/armoury/players.json docs/armoury/summary.json docs/armoury/duplicates.json docs/armoury/online-history.json docs/armoury/new-players-history.json docs/armoury/retention-history.json docs/armoury/by-region.json docs/armoury/history/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore: update armoury data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

          for attempt in 1 2 3 4 5; do
            if git push --quiet; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5), rebasing onto latest and retrying..."
            git pull --rebase --quiet
            sleep 2
          done
          echo "::error::Failed to push armoury data after 5 attempts."
          exit 1

  trigger-next:
    needs: merge
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Download run start time
        uses: actions/download-artifact@v4
        with:
          name: armoury-run-started-at

      - name: Sleep until an hour has passed since this run started
        run: |
          STARTED_AT=$(cat run_started_at.txt)
          NOW=$(date +%s)
          ELAPSED=$(( NOW - STARTED_AT ))
          REMAINING=$(( 3600 - ELAPSED ))
          if [ "$REMAINING" -gt 0 ]; then
            echo "Run took ${ELAPSED}s so far, sleeping ${REMAINING}s to reach exactly 1h."
            sleep "$REMAINING"
          else
            echo "Run already took ${ELAPSED}s (>= 1h) - triggering next run immediately, no sleep."
          fi

      - name: Trigger next run
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run fetch-armoury.yml --repo "${{ github.repository }}"
